name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    # Preview image with Xcode 27.x. macos-latest / macos-26 only ship Xcode 26,
    # which has no iOS 27 SDK. See https://github.com/actions/runner-images
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Pin Xcode 27.2 (image default is 27.1). The app's deployment target is 27.2.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.2

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain and project
        # Fails fast if the image's Xcode can't read the project file.
        run: |
          xcodebuild -version
          xcodebuild -list -project cicd-demo.xcodeproj

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project cicd-demo.xcodeproj \
            -scheme cicd-demo \
            -destination "$SIMULATOR_DESTINATION" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Shown at the top of the run's Summary page, readable without Xcode.
      - name: Publish test summary
        if: always()
        run: scripts/test-summary.sh build/TestResults.xcresult >> "$GITHUB_STEP_SUMMARY"

      # Zipped so the download opens directly in Xcode as TestResults.xcresult.
      - name: Zip test results
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            ditto -c -k --keepParent build/TestResults.xcresult build/TestResults.xcresult.zip
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult.zip
          if-no-files-found: ignore
          retention-days: 14

      # Separate Release build so the artifact doesn't contain the embedded test bundle.
      # Unsigned simulator build: runs in the iOS Simulator only, not on devices.
      - name: Build app (Release, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project cicd-demo.xcodeproj \
            -scheme cicd-demo \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Release-iphonesimulator/cicd-demo.app \
            build/cicd-demo-simulator.app.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo-simulator-app
          path: build/cicd-demo-simulator.app.zip
          if-no-files-found: error
          retention-days: 14
